name: SyphonUniCamExBridge
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: local.syphon-unicamex.bridge
    SWIFT_VERSION: 5.10
targets:
  SyphonUniCamExBridge:
    type: application
    platform: macOS
    sources:
      - path: BridgeApp/Sources
      - path: Shared
    resources:
      - path: BridgeApp/Resources
    settings:
      base:
        INFOPLIST_FILE: BridgeApp/Resources/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Vendor/Syphon-Framework/DerivedData/Build/Products/Release
    dependencies:
      - framework: Vendor/Syphon-Framework/DerivedData/Build/Products/Release/Syphon.framework
